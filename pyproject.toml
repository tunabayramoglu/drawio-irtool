[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irtool"
version = "0.1.0"
description = "Validate, build, and render drawio diagrams from a small YAML IR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "irtool contributors" }]
keywords = ["drawio", "diagrams", "uml", "mcp", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
# MCP server — installs the FastMCP runtime for `python -m irtool_mcp`
# and the `irtool-mcp` console script.
mcp = ["mcp>=1.0"]
# Dev tooling: pytest plus Pillow for visual regression tests.
dev = ["pytest>=7", "Pillow>=10"]

[project.scripts]
# Console entry points installed by pip.
irtool = "irtool.cli:main"
irtool-mcp = "irtool_mcp.server:_console_main"

[project.urls]
Repository = "https://github.com/tunabayramoglu/drawio-irtool"

[tool.setuptools]
# Explicit package list so setuptools doesn't try to package tests/.
packages = ["irtool", "irtool.build", "irtool_mcp"]

[tool.setuptools.package-data]
# Ship bundled examples so get_example() works after pip install.
irtool_mcp = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
